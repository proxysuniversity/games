		<style type="text/css">#startupWatermark{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;opacity:1;pointer-events:none}#startupWatermark .watermark-title{order:2;font-family:Arial,sans-serif;font-size:clamp(20px,3vw,30px);font-weight:700;color:#fff;margin:0;text-align:center;opacity:0;transform:translateY(24px);animation:watermarkTextIn .65s ease .55s forwards}#startupWatermark .watermark-url{order:3;font-family:Arial,sans-serif;font-size:clamp(10px,1.5vw,13px);font-weight:400;color:#888;margin:0;text-align:center;overflow-wrap:anywhere;max-width:90vw;opacity:0;transform:translateY(18px);animation:watermarkTextIn .65s ease .75s forwards}#startupWatermark img{order:1;display:block;width:min(58vw,360px);max-height:55vh;object-fit:contain;transform:translateY(-100vh);animation:watermarkSlideDown .9s cubic-bezier(.22,.8,.25,1) forwards}#startupWatermark.leaving img{animation:watermarkSlideUp .75s cubic-bezier(.55,.05,.8,.4) forwards}#startupWatermark.leaving .watermark-title{animation:watermarkTextOut .75s cubic-bezier(.55,.05,.8,.4) forwards}#startupWatermark.leaving .watermark-url{animation:watermarkTextOut .75s cubic-bezier(.55,.05,.8,.4) forwards}#startupWatermark.leaving{animation:watermarkBackgroundOut .75s ease forwards}@keyframes watermarkSlideDown{from{transform:translateY(-100vh)}to{transform:translateY(0)}}@keyframes watermarkSlideUp{from{transform:translateY(0)}to{transform:translateY(-110vh)}}@keyframes watermarkTextIn{to{opacity:1;transform:translateY(0)}}@keyframes watermarkTextOut{from{opacity:1;transform:translateY(0)}to{opacity:1;transform:translateY(-110vh)}}@keyframes watermarkBackgroundOut{to{opacity:0;visibility:hidden}}body,html{font-family:arial,sans-serif;margin:0;padding:0;width:100%;height:100%;min-width:100%;min-height:100%;overflow:hidden;background-color:#000;text-align:center}canvas{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;transform:none!important;transform-origin:center center!important;z-index:1!important;max-width:none!important;max-height:none!important;display:block!important;margin:0!important;padding:0!important;border:0 none!important;object-fit:fill;background-color:#000;-ms-interpolation-mode:nearest-neighbor;image-rendering:optimizeSpeed;image-rendering:-webkit-optimize-contrast;image-rendering:-moz-crisp-edges;image-rendering:-o-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}.spinner{height:30px;width:30px;margin:20px 0 0 20px;display:inline-block;vertical-align:top;-webkit-animation:rotation .8s linear infinite;-moz-animation:rotation .8s linear infinite;-o-animation:rotation .8s linear infinite;animation:rotation .8s linear infinite;border-left:5px solid #ebebeb;border-right:5px solid #ebebeb;border-bottom:5px solid #ebebeb;border-top:5px solid #787878;border-radius:100%;background-color:#bdd72e}@-webkit-keyframes rotation{from{-webkit-transform:rotate(0)}to{-webkit-transform:rotate(360deg)}}@-moz-keyframes rotation{from{-moz-transform:rotate(0)}to{-moz-transform:rotate(360deg)}}@-o-keyframes rotation{from{-o-transform:rotate(0)}to{-o-transform:rotate(360deg)}}@keyframes rotation{from{transform:rotate(0)}to{transform:rotate(360deg)}}#status{display:inline-block;vertical-align:top;margin-top:30px;margin-left:20px;font-weight:700;color:#787878}#progress{height:20px;width:300px}#output{width:100%;height:200px;margin:10px auto 0;border-left:0;border-right:0;padding-left:0;padding-right:0;display:block;background-color:#000;color:#fff;font-family:'Lucida Console',Monaco,monospace;outline:0}
/* Speedrun timer */
#speedrunToggle{position:fixed;top:12px;right:12px;z-index:22;border:1px solid #fff;border-radius:5px;padding:6px 10px;background:rgba(0,0,0,.85);color:#fff;font-family:Arial,sans-serif;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#speedrunPanel{position:fixed;top:48px;right:12px;z-index:21;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 14px;background:rgba(0,0,0,.9);border:2px solid #fff;border-radius:8px;color:#fff;font-family:Arial,sans-serif;text-align:center;min-width:145px;box-sizing:border-box;opacity:0;visibility:hidden;transform:translateY(-125%);transition:transform .38s cubic-bezier(.22,.8,.25,1),opacity .28s ease,visibility .38s}
#speedrunPanel.is-open{opacity:1;visibility:visible;transform:translateY(0);animation:speedrunCardBob 2s ease-in-out infinite}
@keyframes speedrunCardBob{0%,100%{margin-top:0}50%{margin-top:7px}}
#speedrunTime{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}#speedrunBest{font-size:12px;color:#ffd94a}#speedrunButtons{display:flex;gap:7px}#speedrunPanel button{border:0;border-radius:4px;padding:7px 11px;font-weight:700;cursor:pointer}#speedrunStart{background:#ffd52a;color:#111}#speedrunReset{background:#e6e6e6;color:#111}#speedrunPanel button:disabled{opacity:.65;cursor:default}
@media(max-width:500px){#speedrunToggle{top:8px;right:8px}#speedrunPanel{top:42px;right:8px;padding:8px 9px;min-width:120px}#speedrunTime{font-size:21px}}

</style>

        <script>
        (function () {
            var gameCanvas = document.getElementById("canvas");
            function forceFullGameVisible() {
                var css = {
                    position: "fixed", left: "0", top: "0",
                    right: "0", bottom: "0", width: "100vw", height: "100vh",
                    maxWidth: "none", maxHeight: "none", margin: "0", padding: "0",
                    display: "block", transform: "none", zIndex: "1"
                };
                Object.keys(css).forEach(function (key) {
                    gameCanvas.style.setProperty(key.replace(/[A-Z]/g, function (m) { return "-" + m.toLowerCase(); }), css[key], "important");
                });
            }
            forceFullGameVisible();
            window.addEventListener("resize", forceFullGameVisible);
            window.addEventListener("orientationchange", forceFullGameVisible);
            if (window.ResizeObserver) new ResizeObserver(forceFullGameVisible).observe(document.documentElement);
            /* Some game builds rewrite canvas styles after startup; re-apply the full viewport sizing. */
            setInterval(forceFullGameVisible, 500);
        })();
        </script>

        <button id="speedrunToggle" type="button" aria-controls="speedrunPanel" aria-expanded="false">Speedrun?</button>
        <section id="speedrunPanel" aria-label="Speedrun timer" aria-hidden="true">
            <div id="speedrunTime">00:00.00</div><div id="speedrunBest">BEST: --:--.--</div>
            <div id="speedrunButtons"><button id="speedrunStart" type="button">START</button><button id="speedrunReset" type="button">RESET</button></div>
        </section>
        <script>
        (function () {
            var panel=document.getElementById("speedrunPanel"), toggle=document.getElementById("speedrunToggle"), display=document.getElementById("speedrunTime"), bestDisplay=document.getElementById("speedrunBest"), start=document.getElementById("speedrunStart"), reset=document.getElementById("speedrunReset");
            if(!panel||!toggle||!display||!bestDisplay||!start||!reset)return;
            var startedAt=0, elapsed=0, running=false, frame=0, best=0;
            try{best=Number(window.localStorage.getItem("sonicCdSpeedrunBest"))||0;}catch(e){}
            function fmt(ms){var m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),c=Math.floor(ms%1000/10);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(c).padStart(2,"0");}
            function now(){return elapsed+(running?performance.now()-startedAt:0);}
            function showBest(){bestDisplay.textContent="BEST: "+(best?fmt(best):"--:--.--");}
            function tick(){display.textContent=fmt(now());if(running)frame=requestAnimationFrame(tick);}
            toggle.addEventListener("click",function(){var open=panel.classList.toggle("is-open");toggle.setAttribute("aria-expanded",String(open));panel.setAttribute("aria-hidden",String(!open));});

            showBest();
        })();
