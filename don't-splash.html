<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don't Splash — 3D Poolrooms Survival Horror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010304;
            font-family: 'Courier Prime', monospace;
            color: #d6e4e5;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .font-horror {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.14em;
        }
        /* Subtle analog lens vignette */
        .analog-vignette {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
        }
        /* Split screen subtle divider line */
        .split-divider {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(180, 210, 215, 0.18);
            z-index: 12;
            pointer-events: none;
        }
        /* Round start title fade-in and fade-out after 2s */
        #round-banner {
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease-in-out;
        }
        #round-banner.visible {
            opacity: 1;
        }
        /* Loading screen black fade-in and fade-out */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.65s ease-in-out;
            pointer-events: all;
        }
        #loading-screen.hidden-screen {
            opacity: 0;
            pointer-events: none;
        }
        #loading-img-wrapper {
            opacity: 0;
            transition: opacity 0.75s ease-in-out;
            pointer-events: none;
        }
        #loading-img-wrapper.fade-in {
            opacity: 1;
        }
        #loading-img {
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }
        /* Jump scare violent strobe animation */
        @keyframes scareStrobe {
            0%   { transform: scale(1.05) translate(0px, 0px) rotate(0deg); filter: contrast(1.9) brightness(1.1) saturate(1.4); }
            15%  { transform: scale(1.22) translate(-18px, 12px) rotate(-2deg); filter: contrast(2.4) brightness(0.75) invert(0.12); }
            30%  { transform: scale(1.15) translate(20px, -14px) rotate(2.5deg); filter: contrast(2.1) brightness(1.3); }
            45%  { transform: scale(1.28) translate(-12px, -16px) rotate(-1.5deg); filter: contrast(2.6) brightness(0.6); }
            60%  { transform: scale(1.18) translate(16px, 10px) rotate(2deg); filter: contrast(2.2) brightness(1.25); }
            75%  { transform: scale(1.30) translate(-14px, 8px) rotate(-2.5deg); filter: contrast(2.5) brightness(0.8); }
            100% { transform: scale(1.12) translate(0px, 0px) rotate(0deg); filter: contrast(2.0) brightness(1.0); }
        }
        .scare-active {
            animation: scareStrobe 0.14s infinite;
        }
        .btn-horror {
            background: rgba(8, 14, 16, 0.85);
            border: 1px solid rgba(180, 210, 215, 0.28);
            transition: all 0.16s ease;
        }
        .btn-horror:hover {
            background: rgba(120, 18, 18, 0.45);
            border-color: rgba(239, 68, 68, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.35);
        }
        /* Custom scrollbar for keybinds modal */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050809; }
        ::-webkit-scrollbar-thumb { background: #263538; border-radius: 3px; }
    </style>
</head>
<body>
    <!-- 3D WebGL Viewport -->
    <canvas id="game-canvas"></canvas>

    <!-- Subtle Lens Vignette (No Game UI HUD) -->
    <div class="analog-vignette"></div>
    <div id="split-divider" class="split-divider hidden"></div>

    <!-- Loading Screen Overlay (Starts Black -> Image Fades In -> Image Fades Out to Black -> Reveals Game) -->
    <div id="loading-screen" oncontextmenu="return false;">
        <div id="loading-img-wrapper" class="flex flex-col items-center justify-center max-w-2xl w-full px-6">
            <img id="loading-img" src="" alt="" draggable="false" oncontextmenu="return false;" class="w-full max-h-[65vh] object-contain rounded-lg shadow-[0_0_60px_rgba(0,0,0,0.95)]" />
        </div>
    </div>

    <!-- 2-Second Fading Round Start Title (Only text that appears in-game) -->
    <div id="round-banner" class="fixed inset-x-0 top-14 z-20 flex flex-col items-center justify-center text-center px-4">
        <div id="round-banner-title" class="font-horror text-3xl sm:text-5xl text-slate-100 tracking-[0.28em] uppercase drop-shadow-[0_4px_20px_rgba(0,0,0,0.95)]">
            ROOM 01 — THE SHALLOW BASIN
        </div>
        <div id="round-banner-sub" class="text-xs sm:text-sm text-red-500/90 tracking-[0.35em] uppercase mt-2 drop-shadow-[0_2px_10px_rgba(0,0,0,1)]">
            DON'T TOUCH THE WATER
        </div>
    </div>

    <!-- Full-Screen Image Jump Scare Overlay -->
    <div id="jumpscare-overlay" class="fixed inset-0 z-50 bg-black hidden flex items-center justify-center overflow-hidden">
        <img id="jumpscare-img" src="" alt="" class="w-full h-full object-cover scare-active" />
        <div class="absolute inset-0 bg-red-950/35 mix-blend-multiply pointer-events-none"></div>
    </div>

    <!-- Title / Mode Selection Screen (Transparent background showing live orbiting Poolrooms map) -->
    <div id="menu-overlay" class="fixed inset-0 z-30 flex items-center justify-center p-4">
        <div class="max-w-xl w-full p-6 sm:p-10 text-center flex flex-col items-center">
            <img id="game-logo-img" src="https://cdn-0001.qstv.on.epicgames.com/hgIAokQtMWztMeTlqS/image/logo_s.png" alt="DON'T SPLASH" draggable="false" oncontextmenu="return false;" class="w-full max-w-md max-h-48 sm:max-h-56 object-contain mb-10 drop-shadow-[0_10px_35px_rgba(0,0,0,0.95)] pointer-events-none select-none" />

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md mb-4">
                <button id="btn-solo" class="btn-horror p-4 rounded-lg text-center cursor-pointer backdrop-blur-sm">
                    <div class="font-horror text-xl text-white">SOLO</div>
                </button>
                <button id="btn-coop" class="btn-horror p-4 rounded-lg text-center cursor-pointer backdrop-blur-sm">
                    <div class="font-horror text-xl text-white">2P SPLIT-SCREEN</div>
                </button>
            </div>

            <button id="btn-open-keybinds" class="btn-horror w-full max-w-md py-3 px-4 rounded-lg text-xs text-slate-300 tracking-[0.22em] uppercase cursor-pointer backdrop-blur-sm">
                CONTROLS / KEYBINDS
            </button>
        </div>
    </div>

    <!-- Keybinds Customization Modal -->
    <div id="keybinds-overlay" class="fixed inset-0 z-40 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="max-w-3xl w-full border border-slate-800 bg-neutral-950 p-6 sm:p-8 rounded-xl shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                <div>
                    <h2 class="font-horror text-2xl sm:text-3xl text-white">CUSTOMIZE KEYBINDS</h2>
                    <p class="text-xs text-slate-400 mt-1">Click any action button, then press the desired key on your keyboard.</p>
                </div>
                <button id="btn-reset-keybinds" class="text-xs text-red-400 hover:text-red-300 border border-red-900/60 px-3 py-1.5 rounded cursor-pointer">
                    RESET DEFAULTS
                </button>
            </div>

            <div id="keybinds-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto pr-1 flex-1">
                <!-- Populated dynamically by JS -->
            </div>

            <div class="border-t border-slate-800 pt-4 mt-4 flex justify-end">
                <button id="btn-close-keybinds" class="btn-horror px-8 py-2.5 rounded-lg font-horror text-lg text-white cursor-pointer">
                    SAVE &amp; CLOSE
                </button>
            </div>
        </div>
    </div>

    <!-- Pause / Resume Overlay (ESC) -->
    <div id="pause-overlay" class="fixed inset-0 z-30 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="max-w-md w-full border border-slate-800/80 bg-neutral-950/95 p-8 rounded-xl text-center">
            <h2 class="font-horror text-3xl text-white mb-6">PAUSED</h2>
            <div class="flex flex-col gap-3">
                <button id="btn-resume" class="btn-horror py-3 px-6 rounded-lg font-horror text-lg text-white cursor-pointer">
                    RESUME
                </button>
                <button id="btn-pause-keybinds" class="btn-horror py-3 px-6 rounded-lg text-xs text-slate-300 tracking-[0.2em] uppercase cursor-pointer">
                    CONTROLS / KEYBINDS
                </button>
                <button id="btn-quit-menu" class="btn-horror py-3 px-6 rounded-lg text-xs text-red-400 tracking-[0.2em] uppercase cursor-pointer">
                    EXIT TO TITLE
                </button>
            </div>
        </div>
    </div>

    <script>
    // ============================================================================
    // DON'T SPLASH — 3D Poolrooms Survival Horror (Optimized 60 FPS Engine)
    // ============================================================================

    // ----------------------------------------------------------------------------
    // 0. CODE-ONLY LOADING SCREEN IMAGE URL (Locked in-game; change directly here)
    // ----------------------------------------------------------------------------
    const LOADING_SCREEN_IMAGE_URL = "https://proxysuniversity.github.io/aaron-carters-arcade/Made%20for.png";

    // Block right-click save/inspect context menu globally so image URLs cannot be copied or saved
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('dragstart', (e) => e.preventDefault());

    // ----------------------------------------------------------------------------
    // 1. CUSTOMIZABLE KEYBINDS CONFIGURATION
    // ----------------------------------------------------------------------------
    const DEFAULT_KEYBINDS = {
        p1: {
            forward: 'KeyW',
            backward: 'KeyS',
            left: 'KeyA',
            right: 'KeyD',
            jump: 'Space',
            sprint: 'ShiftLeft',
            interact: 'KeyE',
            throwItem: 'KeyF',
            flashlight: 'KeyT'
        },
        p2: {
            forward: 'ArrowUp',
            backward: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight',
            jump: 'Enter',
            sprint: 'ShiftRight',
            interact: 'KeyO',
            throwItem: 'KeyP',
            flashlight: 'KeyL'
        }
    };

    const ACTION_LABELS = {
        forward: 'Move Forward',
        backward: 'Move Backward',
        left: 'Strafe Left',
        right: 'Strafe Right',
        jump: 'Jump',
        sprint: 'Sprint',
        interact: 'Grab Item / Hold Revive',
        throwItem: 'Throw Distraction',
        flashlight: 'Toggle Flashlight'
    };

    let keybinds = JSON.parse(JSON.stringify(DEFAULT_KEYBINDS));
    try {
        const savedBinds = localStorage.getItem('dont_splash_keybinds_v1');
        if (savedBinds) {
            const parsed = JSON.parse(savedBinds);
            if (parsed.p1 && parsed.p2) {
                keybinds = {
                    p1: { ...DEFAULT_KEYBINDS.p1, ...parsed.p1 },
                    p2: { ...DEFAULT_KEYBINDS.p2, ...parsed.p2 }
                };
            }
        }
    } catch (e) {}

    function saveKeybinds() {
        try {
            localStorage.setItem('dont_splash_keybinds_v1', JSON.stringify(keybinds));
        } catch (e) {}
    }

    function formatKeyCode(code) {
        if (!code) return 'NONE';
        if (code.startsWith('Key')) return code.slice(3);
        if (code.startsWith('Digit')) return code.slice(5);
        if (code === 'Space') return 'SPACE';
        if (code === 'ShiftLeft') return 'L-SHIFT';
        if (code === 'ShiftRight') return 'R-SHIFT';
        if (code === 'ControlLeft') return 'L-CTRL';
        if (code === 'ControlRight') return 'R-CTRL';
        if (code === 'ArrowUp') return 'UP ARROW';
        if (code === 'ArrowDown') return 'DOWN ARROW';
        if (code === 'ArrowLeft') return 'LEFT ARROW';
        if (code === 'ArrowRight') return 'RIGHT ARROW';
        return code.toUpperCase();
    }

    // ----------------------------------------------------------------------------
    // 2. JUMP SCARE HORROR IMAGE URLS + PROCEDURAL FALLBACK
    // ----------------------------------------------------------------------------
    const JUMPSCARE_IMAGE_URLS = [
        "https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=1400&q=85",
        "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=85",
        "https://images.unsplash.com/photo-1604076913837-52ab5629fba9?auto=format&fit=crop&w=1400&q=85"
    ];

    function buildProceduralHorrorScareURL() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 768;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#020202';
        ctx.fillRect(0, 0, c.width, c.height);

        const grad = ctx.createRadialGradient(512, 360, 40, 512, 384, 460);
        grad.addColorStop(0, '#5a6362');
        grad.addColorStop(0.55, '#1d2222');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(512, 380, 250, 340, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(415, 305, 58, 44, -0.18, 0, Math.PI * 2);
        ctx.ellipse(609, 305, 58, 44, 0.18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff1a1a';
        ctx.beginPath();
        ctx.arc(418, 305, 7, 0, Math.PI * 2);
        ctx.arc(606, 305, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#050000';
        ctx.beginPath();
        ctx.ellipse(512, 520, 95, 145, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d4d0c8';
        for (let i = -75; i <= 75; i += 18) {
            ctx.beginPath();
            ctx.moveTo(512 + i - 5, 382);
            ctx.lineTo(512 + i + 5, 382);
            ctx.lineTo(512 + i, 432 + Math.abs(i) * 0.25);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(512 + i - 5, 658);
            ctx.lineTo(512 + i + 5, 658);
            ctx.lineTo(512 + i, 608 - Math.abs(i) * 0.25);
            ctx.fill();
        }
        return c.toDataURL('image/png');
    }

    const FALLBACK_SCARE_DATA_URL = buildProceduralHorrorScareURL();
    const preloadedScareImages = [];
    JUMPSCARE_IMAGE_URLS.forEach((url) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => preloadedScareImages.push(url);
        img.src = url;
    });

    // ----------------------------------------------------------------------------
    // 3. PROCEDURAL HORROR AUDIO ENGINE (Scary BG Music, Flicker Buzz, Sonar Clicks)
    // ----------------------------------------------------------------------------
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.ambienceStarted = false;
            this.lastHeartbeat = 0;
            this.musicMaster = null;
            this.tensionGain = null;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            if (!this.ambienceStarted) {
                this.ambienceStarted = true;
                this.startSubterraneanAmbience();
                this.startHorrorBackgroundMusic();
            }
        }

        // Scary Horror Background Music: eerie detuned string/organ drones, tension riser, & haunted minor-second piano
        startHorrorBackgroundMusic() {
            if (!this.ctx) return;
            try {
                this.musicMaster = this.ctx.createGain();
                this.musicMaster.gain.value = 0.14;
                this.musicMaster.connect(this.ctx.destination);

                // Dark dissonant drone choir (D1, Ab1 tritone, Eb2 minor second)
                const padFreqs = [36.71, 51.91, 77.78];
                padFreqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const g = this.ctx.createGain();

                    osc.type = idx === 2 ? 'triangle' : 'sawtooth';
                    osc.frequency.value = f;
                    osc.detune.value = (idx - 1) * 12;

                    filter.type = 'lowpass';
                    filter.frequency.value = 185;

                    g.gain.value = idx === 2 ? 0.28 : 0.44;
                    osc.connect(filter);
                    filter.connect(g);
                    g.connect(this.musicMaster);
                    osc.start();
                });

                // Tension dissonant tremolo layer that swells when monster hunts
                this.tensionGain = this.ctx.createGain();
                this.tensionGain.gain.value = 0.02;
                this.tensionGain.connect(this.musicMaster);

                [110.0, 116.54, 155.56].forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const lpf = this.ctx.createBiquadFilter();
                    osc.type = 'sawtooth';
                    osc.frequency.value = f;
                    osc.detune.value = idx * 7;
                    lpf.type = 'lowpass';
                    lpf.frequency.value = 340;
                    osc.connect(lpf);
                    lpf.connect(this.tensionGain);
                    osc.start();
                });

                // Sparse haunted horror piano notes (minor 2nd & tritone intervals)
                const scale = [293.66, 311.13, 415.30, 440.00, 587.33, 622.25, 277.18, 207.65];
                let step = 0;
                const playPianoNote = () => {
                    if (this.ctx && this.ctx.state === 'running') {
                        const now = this.ctx.currentTime;
                        const note = scale[(step + Math.floor(Math.random() * 2)) % scale.length];
                        step++;

                        const osc = this.ctx.createOscillator();
                        const sub = this.ctx.createOscillator();
                        const env = this.ctx.createGain();
                        const lpf = this.ctx.createBiquadFilter();

                        osc.type = 'sine';
                        sub.type = 'triangle';
                        osc.frequency.setValueAtTime(note, now);
                        sub.frequency.setValueAtTime(note * 0.5, now);

                        lpf.type = 'lowpass';
                        lpf.frequency.setValueAtTime(1050, now);
                        lpf.frequency.exponentialRampToValueAtTime(210, now + 2.7);

                        env.gain.setValueAtTime(0.0005, now);
                        env.gain.linearRampToValueAtTime(0.34, now + 0.05);
                        env.gain.exponentialRampToValueAtTime(0.0005, now + 2.9);

                        osc.connect(lpf);
                        sub.connect(lpf);
                        lpf.connect(env);
                        env.connect(this.musicMaster);

                        osc.start(now);
                        sub.start(now);
                        osc.stop(now + 3.0);
                        sub.stop(now + 3.0);
                    }
                    setTimeout(playPianoNote, 2100 + Math.random() * 900);
                };
                playPianoNote();
            } catch (e) {}
        }

        setMusicTension(level) {
            if (!this.ctx || !this.tensionGain) return;
            const target = 0.02 + Math.max(0, Math.min(1, level)) * 0.32;
            this.tensionGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.25);
        }

        startSubterraneanAmbience() {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const filter = this.ctx.createBiquadFilter();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 34;
                filter.type = 'lowpass';
                filter.frequency.value = 72;
                gain.gain.value = 0.055;
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();

                const hum = this.ctx.createOscillator();
                const humGain = this.ctx.createGain();
                hum.type = 'sine';
                hum.frequency.value = 120;
                humGain.gain.value = 0.015;
                hum.connect(humGain);
                humGain.connect(this.ctx.destination);
                hum.start();
            } catch (e) {}
        }

        playLightBuzz() {
            if (!this.ctx || this.ctx.state !== 'running') return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120 + Math.random() * 40, now);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.085);
        }

        playSplash(intensity = 1.0) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const duration = 0.55 * Math.min(1.4, Math.max(0.45, intensity));
            const bufferSize = Math.floor(this.ctx.sampleRate * duration);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.24));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(340, now);
            filter.frequency.exponentialRampToValueAtTime(1200, now + 0.14);
            filter.Q.value = 1.5;

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.32 * intensity, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
        }

        playMonsterRoar() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc1.type = 'sawtooth';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(115, now);
            osc1.frequency.exponentialRampToValueAtTime(36, now + 0.9);
            osc2.frequency.setValueAtTime(84, now);
            osc2.frequency.exponentialRampToValueAtTime(28, now + 0.9);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(480, now);
            filter.frequency.exponentialRampToValueAtTime(110, now + 0.9);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.38, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.96);

        playJumpScareShriek() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const freqs = [520, 745, 1110, 1480];
            freqs.forEach((f, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = idx % 2 === 0 ? 'sawtooth' : 'square';
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 0.35, now + 1.15);

                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 1.22);
            });
        }

        playMonsterClick() {
            if (!this.ctx || this.ctx.state !== 'running') return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(180 + Math.random() * 90, now);
            osc.frequency.exponentialRampToValueAtTime(65, now + 0.045);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);

            osc.start(now);

            osc.type = 'sine';

            osc.frequency.exponentialRampToValueAtTime(1280, now + 0.07);

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(135, now);

            gain.gain.setValueAtTime(0.055, now);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

        playHeartbeat(proximity) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const interval = Math.max(0.28, 0.92 - proximity * 0.62);
            if (now - this.lastHeartbeat < interval) return;
            this.lastHeartbeat = now;

            [0, 0.13].forEach((offset, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(idx === 0 ? 52 : 44, now + offset);

                gain.gain.setValueAtTime(0.26 * proximity, now + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + offset);
                osc.stop(now + offset + 0.13);

                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.55);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.6);
            });
        }

                gain.gain.setValueAtTime(0.12, now + i * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + i * 0.06);
                osc.stop(now + i * 0.06 + 0.38);

    // Procedural damp grimy ceramic tile material
    function createGrimyTileMaterial() {
        const size = 256;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#334245';
        ctx.fillRect(0, 0, size, size);

        const cells = 4;
        const step = size / cells;
        for (let gx = 0; gx < cells; gx++) {
            for (let gy = 0; gy < cells; gy++) {
                const shade = 44 + Math.floor(Math.random() * 14);
                ctx.fillStyle = `rgb(${shade}, ${shade + 12}, ${shade + 14})`;
                ctx.fillRect(gx * step + 2, gy * step + 2, step - 4, step - 4);
            }
        }

        // Damp grime & rust spots
        for (let i = 0; i < 65; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = 4 + Math.random() * 18;
            ctx.fillStyle = Math.random() > 0.35 ? 'rgba(12, 22, 18, 0.28)' : 'rgba(58, 34, 20, 0.22)';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        // Grout grid lines
        ctx.strokeStyle = '#131b1d';
        ctx.lineWidth = 3;
        for (let i = 0; i <= cells; i++) {
            ctx.beginPath();
            ctx.moveTo(i * step, 0);
            ctx.lineTo(i * step, size);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i * step);
            ctx.lineTo(size, i * step);
            ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return new THREE.MeshStandardMaterial({
            map: tex,
            roughness: 0.42,
            metalness: 0.08
        });
    }

    function createDarkWaterTextures() {
        const size = 256;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#041216';
        ctx.fillRect(0, 0, size, size);

        ctx.strokeStyle = 'rgba(26, 78, 88, 0.28)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 42; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = 10 + Math.random() * 28;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(14, 18);
        return tex;
    }

    function buildMonsterMesh() {
        const skinMat = new THREE.MeshStandardMaterial({
            color: 0x161c1d,
            roughness: 0.22,
            metalness: 0.18
        });
        const fleshMat = new THREE.MeshStandardMaterial({
            color: 0x4a0c10,
            roughness: 0.35,

        });
        const boneMat = new THREE.MeshStandardMaterial({
            color: 0x8f8a7e,
            roughness: 0.45
        });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });

        // Undulating spine & dorsal ridge segments
        for (let i = 0; i < 6; i++) {
            const segGroup = new THREE.Group();
            segGroup.position.z = -i * 0.48;
            const radius = Math.max(0.14, 0.36 - i * 0.038);

            const bodyMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 10, 8),
                skinMat
            );
            bodyMesh.scale.set(0.95, 0.85, 1.35);
            segGroup.add(bodyMesh);

            // Dorsal jagged spine fin
            const fin = new THREE.Mesh(
                new THREE.ConeGeometry(radius * 0.42, radius * 1.65, 4),
                boneMat
            );
            fin.position.set(0, radius * 0.95, 0);
            fin.rotation.x = -0.35;
            segGroup.add(fin);

            monster.mesh.add(segGroup);
            monster.spineSegments.push({ group: segGroup, index: i });
        }

        // Four multi-jointed clawed limbs
        const limbConfigs = [
            { side: -1, z: -0.35, index: 0 },
            { side: 1, z: -0.35, index: 1 },
            { side: -1, z: -1.45, index: 2 },
            { side: 1, z: -1.45, index: 3 }
        ];
        limbConfigs.forEach((cfg) => {
            const limbGroup = new THREE.Group();
            limbGroup.position.set(cfg.side * 0.32, -0.05, cfg.z);

            const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.55, 6), skinMat);
            upper.rotation.z = cfg.side * 1.15;
            upper.position.x = cfg.side * 0.24;
            limbGroup.add(upper);

            const claw = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.28, 4), boneMat);
            claw.rotation.z = cfg.side * 1.55;
            claw.position.set(cfg.side * 0.54, -0.08, 0.08);
            limbGroup.add(claw);

            monster.mesh.add(limbGroup);
            monster.limbs.push({ group: limbGroup, side: cfg.side, index: cfg.index });
        });

        // Head & 4-way split-petal maw
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.05, 0.36);

        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), skinMat);
        skull.scale.set(0.95, 0.85, 1.25);
        headGroup.add(skull);

        const throat = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), fleshMat);
        throat.position.z = 0.14;
        headGroup.add(throat);

        // Sunken pinprick red eyes
        [-0.14, 0.14].forEach((ex) => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.032, 6, 6), eyeMat);
            eye.position.set(ex, 0.11, 0.27);
            headGroup.add(eye);
        });

        // 4 split-petal jaws lined with needle teeth
        const petalAngles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
        petalAngles.forEach((ang) => {
            const pivot = new THREE.Group();
            pivot.position.z = 0.24;
            pivot.rotation.z = ang;

            const flap = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.44, 4), fleshMat);
            flap.rotation.x = Math.PI / 2;
            flap.position.set(0.11, 0, 0.18);
            pivot.add(flap);

            const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.14, 4), boneMat);
            tooth.rotation.x = Math.PI / 2;
            tooth.position.set(0.06, 0, 0.26);
            pivot.add(tooth);

            headGroup.add(pivot);
            monster.jawPetals.push(pivot);
        });

        monster.mesh.add(headGroup);
        scene.add(monster.mesh);
    }
