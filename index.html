    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    /*

        if (
            typeof game.link === "string" &&
            game.link.trim() !== ""
        ) {

            return game.link.trim();

        }

        if (
            typeof game.file === "string" &&
            game.file.trim() !== ""
        ) {

            let cleanFile =

            cleanFile =
                cleanFile.replace(

                    ""

            return (

        return "";
