    let visibleGames = 0;


    function openGame(game) {

        let gameURL = "";

        /*
         * LINK MODE
         * If "link" is filled in, use that exact URL.
         */
        if (
            typeof game.link === "string" &&
            game.link.trim() !== ""
        ) {

            gameURL =
                game.link.trim();

        }

        /*
         * FILE MODE
         *
         * Files are always loaded from:
         *
         * https://proxysuniversity.github.io/games/
         *
         * So:
         *
         * file: "spacegame.html"
         *
         * becomes:
         *
         * https://proxysuniversity.github.io/games/spacegame.html
         */
        else if (
            typeof game.file === "string" &&
            game.file.trim() !== ""
        ) {

            let cleanFile =
                game.file.trim();

            cleanFile =
                cleanFile.replace(/^\/+/, "");

            gameURL =
                "https://proxysuniversity.github.io/games/" +
                cleanFile;

        }


        if (gameURL === "") {
            return;
        }


        /*
         * OPEN A REAL ABOUT:BLANK WINDOW
         */
        const gameWindow =
            window.open(
                "about:blank",
                "_blank"
            );


        if (!gameWindow) {

            /*
             * If the browser blocks popups,
             * just open the actual game normally.
             */
            window.location.href =
                gameURL;

            return;

        }


        /*
         * CREATE THE CLOAKED GAME PAGE
         */
        gameWindow.document.open();

        gameWindow.document.write(`
            <!DOCTYPE html>

            <html lang="en">

            <head>

                <meta charset="UTF-8">

                <meta
                    name="viewport"
                    content="width=device-width, initial-scale=1.0"
                >

                <title>Proxy University Games│${escapeHTML(game.name || "Game")}</title>

                <style>

                    html,
                    body {
                        margin: 0;
                        padding: 0;
                        width: 100%;
                        height: 100%;
                        overflow: hidden;
                        background: #000;
                    }

                    #gameFrame {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        border: 0;
                        background: #000;
                    }

                    #proxyLogo {
                        position: fixed;
                        top: 12px;
                        right: 12px;
                        width: 170px;
                        max-width: 30vw;
                        height: auto;
                        z-index: 999999;
                        cursor: pointer;
                        opacity: .9;
                    }

                    #proxyLogo:hover {
                        opacity: 1;
                    }

                    #backButton {
                        position: fixed;
                        top: 12px;
                        left: 12px;
                        z-index: 999999;
                        background: #000;
                        color: #fff;
                        border: 1px solid #fff;
                        padding: 10px 15px;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 14px;
                        font-weight: bold;
                        cursor: pointer;
                        opacity: .9;
                    }

                    #backButton:hover {
                        background: #fff;
                        color: #000;
                    }

                </style>

            </head>

            <body>

                <iframe
                    id="gameFrame"
                    allow="fullscreen; autoplay; gamepad"
                    allowfullscreen
                    src="${escapeAttribute(gameURL)}">
                </iframe>

                <img
                    id="proxyLogo"
                    src="https://proxysuniversity.github.io/gamesarewattt.png"
                    alt="Proxy University Games"
                    title="Back to Proxy University Games"
                >

                <button
                    id="backButton">
                    BACK
                </button>

            </body>

            </html>
        `);

        gameWindow.document.close();


        /*
         * FORCE THE CORRECT TITLE AFTER THE PAGE
         * HAS BEEN CREATED.
         */
        gameWindow.document.title =
            "Proxy University Games│" +
            (game.name || "Game");


        const logo =
            gameWindow.document.getElementById(
                "proxyLogo"
            );

        const backButton =
            gameWindow.document.getElementById(
                "backButton"
            );


        /*
         * LOGO -> GAMES PAGE
         */
        logo.addEventListener(
            "click",
            function() {

                gameWindow.location.href =
                    "https://proxysuniversity.github.io/games";

            }
        );


        /*
         * BACK -> GAMES PAGE
         */
        backButton.addEventListener(
            "click",
            function() {

                gameWindow.location.href =
                    "https://proxysuniversity.github.io/games";

            }
        );


        gameWindow.focus();

    }


    /*
     * ESCAPE TEXT USED IN THE ABOUT:BLANK PAGE
     */
    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * ESCAPE URL USED INSIDE THE IFRAME
     */
    function escapeAttribute(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    }


    games.forEach(
        function(game) {

            if (game.hide === true) {
                return;
            }


            if (
                game.name.trim() === "" &&
                game.image.trim() === "" &&
                game.link.trim() === "" &&
                game.file.trim() === ""
            ) {
                return;
            }


            visibleGames++;


            const gameElement =
                document.createElement("div");


            if (
                game.justImage === true &&
                game.image.trim() !== ""
            ) {

                gameElement.className =
                    "just-image-game";


                const image =
                    document.createElement("img");


                image.className =
                    "game-image";


                image.src =
                    game.image;


                image.alt =
                    game.name;


                gameElement.appendChild(
                    image
                );

            }
            else {

                gameElement.className =
                    "game";


                if (
                    game.image.trim() !== ""
                ) {

                    const image =
                        document.createElement("img");


                    image.className =
                        "game-image";


                    image.src =
                        game.image;


                    image.alt =
                        game.name;


                    gameElement.appendChild(
                        image
                    );

                }


                const info =
                    document.createElement("div");


                info.className =
                    "game-info";


                if (
                    game.name.trim() !== ""
                ) {

                    const name =
                        document.createElement("div");


                    name.className =
                        "game-name";


                    name.textContent =
                        game.name;


                    info.appendChild(
                        name
                    );

                }


                if (
                    game.description.trim() !== ""
                ) {

                    const description =
                        document.createElement("div");


                    description.className =
                        "game-description";


                    description.textContent =
                        game.description;


                    info.appendChild(
                        description
                    );

                }


                if (
                    game.link.trim() !== ""
                ) {

                    const linkText =
                        document.createElement("div");


                    linkText.className =
                        "game-link";


                    linkText.textContent =
                        "proxy link: " +
                        game.link;


                    info.appendChild(
                        linkText
                    );

                }


                gameElement.appendChild(
                    info
                );

            }


            gameElement.addEventListener(
                "click",
                function() {

                    openGame(game);

                }
            );


            gamesList.appendChild(
                gameElement
            );

        }
    );


    if (visibleGames === 0) {

        emptyMessage.style.display =
            "block";

    }


    /*
     * LEAVE-PAGE WARNING
     */
    window.addEventListener(
        "beforeunload",
        function(event) {

            event.preventDefault();

            event.returnValue = "";

        }
    );

</script>
