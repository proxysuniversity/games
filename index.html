/* ============================================================
   PAGE ELEMENTS
   ============================================================ */

const gamesList =
    document.getElementById("gamesList");

const emptyMessage =
    document.getElementById("emptyMessage");

let visibleGames = 0;


/* ============================================================
   SAFE STRING FUNCTION
   ============================================================ */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value);

}


/* ============================================================
   URL / TEXT SAFETY
   ============================================================ */

function escapeHTML(value) {

    return safeString(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return safeString(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* ============================================================
   BUILD GAME URL
   ============================================================ */

function getGameURL(game) {

    if (!game || typeof game !== "object") {
        return "";
    }


    const link =
        safeString(game.link).trim();

    const file =
        safeString(game.file).trim();


    /*
     * LINK ALWAYS HAS PRIORITY.
     */

    if (link !== "") {

        return link;

    }


    /*
     * IF THERE IS NO LINK,
     * USE THE FILE FIELD.
     */

    if (file !== "") {

        const cleanFile =
            file.replace(/^\/+/, "");

        return (
            "https://proxysuniversity.github.io/games/" +
            cleanFile
        );

    }


    return "";

}


/* ============================================================
   OPEN GAME
   ============================================================ */

function openGame(game) {

    if (!game) {
        return;
    }


    const gameURL =
        getGameURL(game);


    if (gameURL === "") {
        return;
    }


    const gameName =
        safeString(game.name).trim();


    const gameTitle =
        "Proxy University Games│" +
        (
            gameName !== ""
                ? gameName
                : "Game"
        );


    /*
     * OPEN ABOUT:BLANK IMMEDIATELY.
     */

    let gameWindow = null;

    try {

        gameWindow =
            window.open(
                "about:blank",
                "_blank"
            );

    }
    catch (error) {

        gameWindow = null;

    }


    /*
     * POPUP BLOCKED.
     */

    if (!gameWindow) {

        window.location.href =
            gameURL;

        return;

    }


    /*
     * BUILD THE WRAPPER PAGE.
     */

    const wrapperHTML =
        "<!DOCTYPE html>" +

        "<html lang='en'>" +

        "<head>" +

        "<meta charset='UTF-8'>" +

        "<meta name='viewport' " +
        "content='width=device-width, initial-scale=1.0'>" +

        "<title>" +
        escapeHTML(gameTitle) +
        "</title>" +

        "<style>" +

        "html,body{" +
            "margin:0;" +
            "padding:0;" +
            "width:100%;" +
            "height:100%;" +
            "overflow:hidden;" +
            "background:#000;" +
        "}" +

        "#gameFrame{" +
            "position:fixed;" +
            "top:0;" +
            "left:0;" +
            "width:100%;" +
            "height:100%;" +
            "border:0;" +
            "background:#000;" +
        "}" +

        "#proxyLogo{" +
            "position:fixed;" +
            "top:12px;" +
            "right:12px;" +
            "width:170px;" +
            "max-width:30vw;" +
            "height:auto;" +
            "z-index:999999;" +
            "cursor:pointer;" +
            "opacity:.9;" +
        "}" +

        "#proxyLogo:hover{" +
            "opacity:1;" +
        "}" +

        "#backButton{" +
            "position:fixed;" +
            "top:12px;" +
            "left:12px;" +
            "z-index:999999;" +
            "background:#000;" +
            "color:#fff;" +
            "border:1px solid #fff;" +
            "padding:10px 15px;" +
            "font-family:Arial,Helvetica,sans-serif;" +
            "font-size:14px;" +
            "font-weight:bold;" +
            "cursor:pointer;" +
            "opacity:.9;" +
        "}" +

        "#backButton:hover{" +
            "background:#fff;" +
            "color:#000;" +
        "}" +

        "</style>" +

        "</head>" +

        "<body>" +

        "<iframe " +
            "id='gameFrame' " +
            "src='" +
            escapeAttribute(gameURL) +
            "' " +
            "allow='fullscreen; autoplay; gamepad' " +
            "allowfullscreen>" +
        "</iframe>" +

        "<img " +
            "id='proxyLogo' " +
            "src='https://proxysuniversity.github.io/gamesarewattt.png' " +
            "alt='Proxy University Games' " +
            "title='Back to Proxy University Games'>" +

        "<button " +
            "id='backButton' " +
            "type='button'>" +
            "BACK" +
        "</button>" +

        "<script>" +

        "const returnURL=" +
        "'https://proxysuniversity.github.io/games';" +

        "document.getElementById('proxyLogo')" +
        ".addEventListener('click',function(){" +
            "window.location.href=returnURL;" +
        "});" +

        "document.getElementById('backButton')" +
        ".addEventListener('click',function(){" +
            "window.location.href=returnURL;" +
        "});" +

        "<\/script>" +

        "</body>" +

        "</html>";


    try {

        gameWindow.document.open();

        gameWindow.document.write(
            wrapperHTML
        );

        gameWindow.document.close();

        gameWindow.document.title =
            gameTitle;

        gameWindow.focus();

    }
    catch (error) {

        /*
         * IF THE WRAPPER FAILS,
         * FALL BACK TO THE REAL GAME.
         */

        try {

            gameWindow.location.href =
                gameURL;

        }
        catch (fallbackError) {

            window.location.href =
                gameURL;

        }

    }

}


/* ============================================================
   RENDER GAMES
   ============================================================ */

function renderGames() {

    if (!gamesList) {
        return;
    }


    gamesList.innerHTML = "";

    visibleGames = 0;


    games.forEach(
        function (game) {

            if (!game) {
                return;
            }


            if (game.hide === true) {
                return;
            }


            const name =
                safeString(game.name).trim();

            const image =
                safeString(game.image).trim();

            const link =
                safeString(game.link).trim();

            const file =
                safeString(game.file).trim();

            const description =
                safeString(game.description).trim();


            /*
             * COMPLETELY EMPTY GAME SLOT.
             */

            if (
                name === "" &&
                image === "" &&
                link === "" &&
                file === ""
            ) {

                return;

            }


            visibleGames++;


            /*
             * IMAGE-ONLY GAME
             */

            if (
                game.justImage === true &&
                image !== ""
            ) {

                const gameElement =
                    document.createElement(
                        "div"
                    );


                gameElement.className =
                    "just-image-game";


                const imageElement =
                    document.createElement(
                        "img"
                    );


                imageElement.className =
                    "game-image";


                imageElement.src =
                    image;


                imageElement.alt =
                    name || "Game";


                imageElement.draggable =
                    false;


                gameElement.appendChild(
                    imageElement
                );


                gameElement.addEventListener(
                    "click",
                    function () {

                        openGame(game);

                    }
                );


                gamesList.appendChild(
                    gameElement
                );


                return;

            }


            /*
             * NORMAL GAME
             */

            const gameElement =
                document.createElement(
                    "div"
                );


            gameElement.className =
                "game";


            /*
             * IMAGE
             */

            if (image !== "") {

                const imageElement =
                    document.createElement(
                        "img"
                    );


                imageElement.className =
                    "game-image";


                imageElement.src =
                    image;


                imageElement.alt =
                    name || "Game";


                imageElement.draggable =
                    false;


                gameElement.appendChild(
                    imageElement
                );

            }


            /*
             * INFORMATION
             */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "game-info";


            /*
             * NAME
             */

            if (name !== "") {

                const nameElement =
                    document.createElement(
                        "div"
                    );


                nameElement.className =
                    "game-name";


                nameElement.textContent =
                    name;


                info.appendChild(
                    nameElement
                );

            }


            /*
             * DESCRIPTION
             */

            if (description !== "") {

                const descriptionElement =
                    document.createElement(
                        "div"
                    );


                descriptionElement.className =
                    "game-description";


                descriptionElement.textContent =
                    description;


                info.appendChild(
                    descriptionElement
                );

            }


            /*
             * LINK TEXT
             *
             * Only show this when the LINK field
             * itself is actually filled.
             */

            if (link !== "") {

                const linkElement =
                    document.createElement(
                        "div"
                    );


                linkElement.className =
                    "game-link";


                linkElement.textContent =
                    "proxy link: " +
                    link;


                info.appendChild(
                    linkElement
                );

            }


            gameElement.appendChild(
                info
            );


            /*
             * CLICK GAME
             */

            gameElement.addEventListener(
                "click",
                function () {

                    openGame(game);

                }
            );


            gamesList.appendChild(
                gameElement
            );

        }
    );


    /*
     * EMPTY MESSAGE
     */

    if (
        emptyMessage
    ) {

        if (
            visibleGames === 0
        ) {

            emptyMessage.style.display =
                "block";

        }
        else {

            emptyMessage.style.display =
                "none";

        }

    }

}


/* ============================================================
   START JAVASCRIPT
   ============================================================ */

renderGames();

</script>
