/* =========================================================
   GAME URL
   ========================================================= */

function getGameURL(game) {

    if (game.link && game.link.trim() !== "") {
        return game.link.trim();
    }

    if (game.file && game.file.trim() !== "") {

        let fileName = game.file.trim();

        fileName = fileName.replace(/^\/+/, "");

        return "https://proxysuniversity.github.io/games/" + fileName;
    }

    return "";
}

/* =========================================================
   OPEN GAME
   ========================================================= */

function openGame(game) {

    const gameURL = getGameURL(game);

    if (!gameURL) {
        return;
    }

    const gameWindow = window.open("about:blank", "_blank");

    if (!gameWindow) {
        window.location.href = gameURL;
        return;
    }

    const safeTitle =
        game.name && game.name.trim() !== ""
            ? game.name.trim()
            : "Game";

    const logoURL =
        "https://proxysuniversity.github.io/gamesarewattt.png";

    const wrapperHTML = `
<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy University Games│${escapeHTML(safeTitle)}</title>

    }

    }

/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

/* =========================================================
   RENDER GAMES
   ========================================================= */

function renderGames() {

    const container =
        document.getElementById("gamesContainer");

    const emptyMessage =
        document.getElementById("emptyMessage");

    container.innerHTML = "";

    let visibleGames = 0;

    games.forEach(function (game) {

        if (game.hide === true) {
            return;
        }

        const gameURL = getGameURL(game);

        if (!game.name && !game.image && !gameURL) {
            return;
        }

        visibleGames++;

        const row =
            document.createElement("div");

        row.className = "game-row";

        if (game.justImage === true && game.image) {
            row.classList.add("just-image");
        }

        /* =========================
           IMAGE
        ========================= */

        if (game.image) {

            const imageWrap =
                document.createElement("div");

            imageWrap.className =
                "game-image-wrap";

            const image =
                document.createElement("img");

            image.className =
                "game-image";

            image.src = game.image;

            image.alt =
                game.name || "Game";

            image.draggable = false;

            imageWrap.appendChild(image);

            row.appendChild(imageWrap);
        }

        /* =========================
           INFO
        ========================= */

        if (!(game.justImage === true && game.image)) {

            const info =
                document.createElement("div");

            info.className =
                "game-info";

            if (game.name) {

                const name =
                    document.createElement("h2");

                name.className =
                    "game-name";

                name.textContent =
                    game.name;

                info.appendChild(name);
            }

            if (game.description) {

                const description =
                    document.createElement("p");

                description.className =
                    "game-description";

                description.textContent =
                    game.description;

                info.appendChild(description);
            }

            row.appendChild(info);

            if (gameURL) {

                const arrow =
                    document.createElement("div");

                arrow.className =
                    "game-arrow";

                arrow.textContent =
                    "›";

                row.appendChild(arrow);
            }
        }

        /* =========================
           CLICK
        ========================= */

        row.addEventListener("click", function () {
            openGame(game);
        });

        container.appendChild(row);
    });

    if (visibleGames === 0) {
        emptyMessage.style.display = "block";
    } else {
        emptyMessage.style.display = "none";
    }
}

/* =========================================================
   BLOCKED OVERLAY
   ========================================================= */

const blockedOverlay =
    document.getElementById("blockedOverlay");

function hideBlockedOverlay() {

    if (!blockedOverlay) {
        return;
    }

    blockedOverlay.classList.add("hidden");

    setTimeout(function () {

        if (
            blockedOverlay &&
            blockedOverlay.parentNode
        ) {
            blockedOverlay.remove();
        }

    }, 500);
}

blockedOverlay.addEventListener(
    "pointerdown",
    function () {

        setTimeout(
            hideBlockedOverlay,
            500
        );

    },
    {
        once: true
    }
);

/* =========================================================
   START
   ========================================================= */

renderGames();

</script>
