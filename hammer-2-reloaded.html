    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

    .h2-actions { display:flex; flex-wrap:wrap; gap:7px; }

    #h2-fps { position:fixed; top:16px; left:16px; z-index:10005; padding:6px 9px; border-radius:5px; color:#8dff9d; background:#000a; font:bold 13px monospace; pointer-events:none; }

  <script>
    const introLogo = document.getElementById("watermarkLogo");
    const introTitle = document.querySelector("#startupWatermark .watermark-title");

    function sizeIntroLogo() {
      if (!introLogo || !introTitle || !introLogo.naturalWidth) return;
      const titleWidth = introTitle.getBoundingClientRect().width;
      introLogo.style.width = (titleWidth * 1.1) + "px";
      introLogo.style.height = "auto";
    }

    if (introLogo) {
      introLogo.addEventListener("load", sizeIntroLogo);
      if (introLogo.complete) sizeIntroLogo();
    }

    if (introTitle && "ResizeObserver" in window) {
      new ResizeObserver(sizeIntroLogo).observe(introTitle);
    }

    document.fonts?.ready.then(sizeIntroLogo);
    window.addEventListener("resize", sizeIntroLogo);

    (() => {
      const $ = (id) => document.getElementById(id);
      const panel = $("h2-tools-panel");
      const toggle = $("h2-tools-toggle");
      const fpsDisplay = $("h2-fps");
      const crosshair = $("h2-crosshair");
      const fpsToggle = $("h2-fps-toggle");
      const fileInput = $("h2-crosshair-file");
      const urlInput = $("h2-crosshair-url");

      let fpsVisible = false;
      let frameCount = 0;
      let lastFpsUpdate = performance.now();

      function openPanel(open) {
        panel.classList.toggle("open", open);
        toggle.setAttribute("aria-expanded", String(open));
      }

      toggle.addEventListener("click", () => {
        openPanel(!panel.classList.contains("open"));
      });

      $("h2-tools-close").addEventListener("click", () => openPanel(false));

      function setFpsVisible(show) {
        fpsVisible = show;
        fpsDisplay.hidden = !show;
        fpsToggle.textContent = show ? "Hide FPS" : "Show FPS";
      }

      fpsToggle.addEventListener("click", () => setFpsVisible(!fpsVisible));

      function countFrames(now) {
        frameCount++;

        if (now - lastFpsUpdate >= 500) {
          const fps = Math.round(frameCount * 1000 / (now - lastFpsUpdate));
          fpsDisplay.textContent = "FPS: " + fps;
          frameCount = 0;
          lastFpsUpdate = now;
        }

        requestAnimationFrame(countFrames);
      }

      requestAnimationFrame(countFrames);

      function showCrosshair(src) {
        if (!src) return;

        const test = new Image();

        test.onload = () => {
          crosshair.src = src;
          crosshair.classList.remove("hidden");
          crosshair.style.display = "block";

          try {
            localStorage.setItem("h2-crosshair-image", src);
          } catch (e) {
            console.warn("Crosshair image too large to save between visits.");
          }
        };

        test.onerror = () => alert("That image could not be loaded. Try another image or URL.");
        test.src = src;
      }

      const savedCrosshair = localStorage.getItem("h2-crosshair-image");
      if (savedCrosshair) showCrosshair(savedCrosshair);

      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          alert("Please choose an image file.");
          return;
        }

        const reader = new FileReader();
        reader.onload = () => showCrosshair(reader.result);
        reader.readAsDataURL(file);
      });

      $("h2-crosshair-apply").addEventListener("click", () => {
        const url = urlInput.value.trim();

        if (url) {
          showCrosshair(url);
        } else if (fileInput.files && fileInput.files[0]) {
          fileInput.dispatchEvent(new Event("change"));
        } else {
          alert("Upload an image or paste an image URL first.");
        }
      });

      $("h2-crosshair-clear-url").addEventListener("click", () => {
        urlInput.value = "";
        urlInput.focus();
      });

      $("h2-crosshair-hide").addEventListener("click", () => {
        crosshair.classList.add("hidden");
        crosshair.style.display = "none";
      });

      $("h2-crosshair-show").addEventListener("click", () => {
        if (crosshair.src) {
          crosshair.classList.remove("hidden");
          crosshair.style.display = "block";
        } else {
          alert("Upload an image or paste an image URL first.");
        }
      });
    })();

    const SPLIT_MAP = {
      "29e3d3c8908bb566507cd8b1b3560e15.data": null,
      "0c2c310b28788b93284ef8d4d4fc6791.wasm": null,
      "01288fb2e5f57e194e52e16f7bed4cd4.framework.js": null
    };

    function mimeFor(url) {
      if (url.includes(".wasm")) return "application/wasm";
      if (url.includes(".js")) return "text/javascript";
      return "application/octet-stream";
    }

    async function resolveFile(baseUrl) {
      try {
        const zipUrl = baseUrl + ".zip";
        const zipHead = await fetch(zipUrl, { method: "HEAD" });

        if (zipHead.ok) {
          const res = await fetch(zipUrl);
          const zip = await JSZip.loadAsync(await res.arrayBuffer());
          const entry = Object.values(zip.files).find(f => !f.dir);
          const data = await entry.async("arraybuffer");
          return URL.createObjectURL(new Blob([data], { type: mimeFor(baseUrl) }));
        }
      } catch (e) {}

      try {
        const firstPart = baseUrl + ".zip.part1";
        const firstHead = await fetch(firstPart, { method: "HEAD" });

        if (firstHead.ok) {
          const parts = [firstPart];

          for (let i = 2; i <= 99; i++) {
            const partUrl = baseUrl + ".zip.part" + i;
            const h = await fetch(partUrl, { method: "HEAD" });
            if (!h.ok) break;
            parts.push(partUrl);
          }

          const buffers = await Promise.all(parts.map(async (u) => {
            const r = await fetch(u);
            if (!r.ok) throw new Error("Failed part " + u);
            return new Uint8Array(await r.arrayBuffer());
          }));

          const total = buffers.reduce((a, b) => a + b.length, 0);
          const merged = new Uint8Array(total);
          let offset = 0;

          for (const b of buffers) {
            merged.set(b, offset);
            offset += b.length;
          }

          const zip = await JSZip.loadAsync(merged.buffer);
          const entry = Object.values(zip.files).find(f => !f.dir);
          const data = await entry.async("arraybuffer");
          return URL.createObjectURL(new Blob([data], { type: mimeFor(baseUrl) }));
        }
      } catch (e) {}

      const parts = [];

      for (let i = 1; i <= 99; i++) {
        const testUrl = baseUrl + ".part" + i;

        try {
          const head = await fetch(testUrl, { method: "HEAD" });
          if (!head.ok) break;
          parts.push(testUrl);
        } catch {
          break;
        }
      }

      if (parts.length === 0) return baseUrl;

      const buffers = await Promise.all(parts.map(async (u) => {
        const r = await fetch(u);
        if (!r.ok) throw new Error("Failed part " + u);
        return new Uint8Array(await r.arrayBuffer());
      }));

      const total = buffers.reduce((a, b) => a + b.length, 0);
      const merged = new Uint8Array(total);
      let offset = 0;

      for (const b of buffers) {
        merged.set(b, offset);
        offset += b.length;
      }

      return URL.createObjectURL(new Blob([merged]));
    }

    async function preMergeAll() {
      const map = {};
      const files = Object.entries(SPLIT_MAP);
      const total = files.length;
      let done = 0;
      const loadingText = document.getElementById("loading-text");

      for (const [file] of files) {
        const resolved = await resolveFile("Build/" + file);
        map[file] = resolved;
        done++;
        loadingText.innerText = `LOADING... ${Math.floor((done / total) * 100)}%`;
        console.log("Resolved:", file, "→", resolved);
      }

      loadingText.style.display = "none";
      return map;
    }

    (async () => {
      const mergedMap = await preMergeAll();
      window.SPLIT_MAP = mergedMap;

      const origFetch = window.fetch;

      window.fetch = async function(resource, options) {
        if (typeof resource === "string") {
          const key = resource.split("/").pop();

          if (mergedMap[key]) return origFetch(mergedMap[key], options);

          if (resource.includes("StreamingAssets")) {
            return origFetch(
              document.querySelector("base").href +
              "/StreamingAssets/" +
              resource.split("/StreamingAssets/")[1]
            );
          }
        }

        return origFetch(resource, options);
      };

      const OrigXHR = window.XMLHttpRequest;

      window.XMLHttpRequest = function() {
        const xhr = new OrigXHR();
        const origOpen = xhr.open;

        xhr.open = function(method, url, ...rest) {
          const key = url.split("/").pop();
          origOpen.call(xhr, method, mergedMap[key] || url, ...rest);
        };

        return xhr;
      };

      const canvas = document.querySelector("#unity-canvas");
      const loaderUrl = "Build/Build.loader.js";

      const config = {
        dataUrl: mergedMap["29e3d3c8908bb566507cd8b1b3560e15.data"],
        frameworkUrl: mergedMap["01288fb2e5f57e194e52e16f7bed4cd4.framework.js"],
        codeUrl: mergedMap["0c2c310b28788b93284ef8d4d4fc6791.wasm"],
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hammer 2",
        productName: "Hammer 2",
        productVersion: "1.0.0"
      };

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, () => {}).then((unityInstance) => {
          window.gameInstance = unityInstance;

          const watermark = document.getElementById("startupWatermark");

          if (watermark) {
            watermark.classList.add("leaving");

            window.setTimeout(() => {
              if (watermark.parentNode) watermark.parentNode.removeChild(watermark);
            }, 800);
          }
        }).catch((message) => alert(message));
      };

      document.body.appendChild(script);
    })();

    function resizeCanvas() {
      const canvas = document.getElementById("unity-canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("load", resizeCanvas);
    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
